---

helmDefaults:
  cleanupOnFail: false
  verify: false
  wait: true
  timeout: 120
  historyMax: 5

repositories:
  - name: argo
    url: https://argoproj.github.io/argo-helm

releases:
  - name: argo-rollouts
    namespace: argo-rollouts
    createNamespace: true
    chart: argo/argo-rollouts
    version: 2.43.1
    values:
      - ./values.yaml
