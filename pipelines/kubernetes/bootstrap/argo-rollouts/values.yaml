---

keepCRDs: false   # For clean uninstall

controller:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

  # Gateway API plugin
  # https://github.com/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi/blob/main/docs/installation.md
  initContainers:
    - name: copy-gwapi-plugin
      image: ghcr.io/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi:v0.17.0
      command: ["/bin/sh", "-c"]
      args:
        - cp /bin/rollouts-plugin-trafficrouter-gatewayapi /plugins
      volumeMounts:
        - name: gwapi-plugin
          mountPath: /plugins
  trafficRouterPlugins:
    - name: argoproj-labs/gatewayAPI
      location: "file:///plugins/rollouts-plugin-trafficrouter-gatewayapi"
  volumes:
    - name: gwapi-plugin
      emptyDir: {}
  volumeMounts:
    - name: gwapi-plugin
      mountPath: /plugins

dashboard:
  enabled: true

  ingress:
    enabled: false    # Use httproute instead
    ingressClassName: kong
    hosts:
      - argorollouts.internal

  httproute:
    enabled: true
    parentRefs:
      - name: kong
        namespace: kong
    hostnames:
      - argorollouts.internal
