---

keepCRDs: false   # For clean uninstall

controller:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

dashboard:
  enabled: true

  ingress:
    enabled: false    # Use httproute instead
    ingressClassName: kong
    hosts:
      - argorollouts.internal

  httproute:
    enabled: true
    parentRefs:
      - name: kong
        namespace: kong
    hostnames:
      - argorollouts.internal
