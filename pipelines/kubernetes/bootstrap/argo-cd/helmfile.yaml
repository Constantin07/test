---

helmDefaults:
  cleanupOnFail: false
  verify: false
  wait: true
  timeout: 180
  historyMax: 5

repositories:
  - name: argo
    url: https://argoproj.github.io/argo-helm

apiVersions:
  - monitoring.coreos.com/v1

releases:
  - name: argo-cd
    namespace: argocd
    createNamespace: true
    chart: argo/argo-cd
    version: 10.9.1
    values:
      - ./values.yaml
