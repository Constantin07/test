# https://github.com/Kong/charts/blob/main/charts/ingress/README.md
---
controller:
  enabled: true

gateway:
  enabled: true
  deployment:
    enabled: true

  # Schedule on master node
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""

  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node.kubernetes.io/memory-pressure"
      operator: "Exists"

  env:
   proxy_listen: "0.0.0.0:8000, 0.0.0.0:8443 http2 ssl"

   admin_listen: "0.0.0.0:8444 http2 ssl"

   status_listen: "0.0.0.0:8100"

  proxy:
    http:
      servicePort: 8080  # same port nr. as in Gateway resource
      nodePort: 30000    # must be in the valid NodePort range (30000-32767)
    type: NodePort       # Use NodePort to expose the proxy on on-prem VMs
    ipFamilies: ["IPv4"]
