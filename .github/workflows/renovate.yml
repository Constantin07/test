name: Renovate

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/renovate.yml
      - .github/renovate.json

  schedule:
    - cron: "30 3 * * *" 

concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
      vulnerability-alerts: read
      statuses: write
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.1
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate-bot@users.noreply.github.com>"
          LOG_LEVEL: debug
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
