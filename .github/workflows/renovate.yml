name: Renovate

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/renovate.yml
      - .github/renovate.json

  schedule:
    - cron: "30 3 * * *" 

  workflow_dispatch:

concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate-config:
    name: Validate configuration
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Renovate configuration
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ghcr.io/renovatebot/renovate:44.119.1 \
            renovate-config-validator .github/renovate.json

  renovate:
    name: Run Renovate
    needs: [renovate-config]
    runs-on: ubuntu-24.04
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_APP_UPD_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_UPD_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.6
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate-bot@users.noreply.github.com>"
          LOG_LEVEL: debug
        with:
          token: ${{ steps.app-token.outputs.token }}
