name: Renovate

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/renovate.yml
      - .github/renovate.json

  schedule:
    - cron: "30 3 * * *" 

  workflow_dispatch:

concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_UPD_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_UPD_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.6
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate-bot@users.noreply.github.com>"
          LOG_LEVEL: debug
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Fail if Renovate configuration is invalid
        if: failure()
        run: exit 1
