---

nerdctl_version: 2.3.5
nerdctl_url: https://github.com/containerd/nerdctl/releases/download/v{{ nerdctl_version }}/nerdctl-{{ nerdctl_version }}-linux-{{ arch_map[ansible_architecture] }}.tar.gz
nerdctl_install_dir: /usr/local/bin

cni_plugins_version: v1.9.1
cni_plugins_url: https://github.com/containernetworking/plugins/releases/download/{{ cni_plugins_version }}/cni-plugins-linux-{{ arch_map[ansible_architecture] }}-{{ cni_plugins_version }}.tgz
cni_plugins_install_dir: /opt/cni/bin/

buildkit_version: v0.32.2
buildkit_url: https://github.com/moby/buildkit/releases/download/{{ buildkit_version }}/buildkit-{{ buildkit_version }}.linux-{{ arch_map[ansible_architecture] }}.tar.gz
buildkit_install_dir: /usr/local/bin
